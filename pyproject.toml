[project]
name = "zhenxun-plugin-group-helper"
version = "0.1.0"
description = "真寻 QQ 群管理插件：禁言、解除禁言和二次确认踢人"
authors = [{name = "lumen"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nonebot2>=2.2.0,<3",
    "nonebot-adapter-onebot>=2.0.0,<3",
]

[project.urls]
Homepage = "https://github.com/lumenmai"
Repository = "https://github.com/lumenmai/zhenxun-plugin-group-helper"
Issues = "https://github.com/lumenmai/zhenxun-plugin-group-helper/issues"

[project.optional-dependencies]
dev = [
    "nonebot2[fastapi]>=2.2.0,<3",
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<0.26",
    "pytest-mock>=3.14,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["group_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:nonebug"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F"]
